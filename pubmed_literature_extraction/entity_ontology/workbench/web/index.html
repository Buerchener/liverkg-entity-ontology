<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22262a">
  <title>Entity Ontology Workbench · LiverTrail</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/workbench-shell.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="workbench-page">
  <a class="workbench-skip" href="#main">Skip to content</a>
  <header class="workbench-masthead">
    <div class="masthead-inner">
      <a class="workbench-brand" href="#overview" aria-label="LiverTrail batch overview">LiverTrail</a>
      <span class="masthead-title">Entity Ontology Workbench</span>
    </div>
  </header>
  <div class="workbench-layout">
    <aside class="workbench-sidebar">
      <nav id="stages" class="workbench-navigation" aria-label="Entity ontology workflow"></nav>
    </aside>
    <main id="main" tabindex="-1">
      <div class="frame workbench-bar">
        <nav id="crumb" class="crumb" aria-label="Breadcrumb"></nav>
        <label id="batch-switcher" hidden><span>Batch</span><select id="batch-choice"></select></label>
      </div>
      <div class="frame heading-band">
        <h1 id="heading">Batch Overview</h1>
        <p id="subtitle" class="subtitle"></p>
      </div>
      <div id="content" class="frame">
        <p class="loading-note" role="status">Loading batch results…</p>
      </div>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
